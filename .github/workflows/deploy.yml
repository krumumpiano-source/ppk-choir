name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Build and Deploy
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js first
        run: npx next build
        env:
          NODE_ENV: production

      - name: Run next-on-pages
        run: npx @cloudflare/next-on-pages@1.13.16

      - name: List build output
        run: |
          echo "=== Contents of .vercel/output/static ==="
          ls -la .vercel/output/static/ || echo "Directory not found!"
          echo "=== Checking for _worker.js ==="
          ls -la .vercel/output/static/_worker.js || echo "_worker.js NOT found!"

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 183a56f865a8860d48f7fe0414e34289
          command: pages deploy .vercel/output/static --project-name=ppk-choir --branch=master
